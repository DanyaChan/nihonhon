<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本本 — читалка японских книг</title>
  <!-- Путь относительный: сайт живёт в подкаталоге /nihonhon/ на Pages -->
  <link rel="icon" href="favicon2.ico" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon2.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Полоски у краёв: наведение на них выдвигает скрытую панель.
       Стоят перед своими панелями — CSS показывает панель через ~ -->
  <div id="edge-top" class="edge-zone"></div>

  <header id="toolbar">
    <button id="btn-toc" data-tip="Оглавление и закладки" aria-label="Оглавление и закладки">☰</button>
    <span id="book-title">日本本</span>
    <div class="spacer"></div>
    <button id="btn-bookmark" data-tip="Добавить закладку" aria-label="Добавить закладку">🔖</button>
    <button id="btn-recent" data-tip="Недавние книги" aria-label="Недавние книги">📚</button>
    <button id="btn-settings" data-tip="Настройки" aria-label="Настройки">⚙</button>
    <button id="btn-open" data-tip="Открыть книгу (.epub / .txt)" aria-label="Открыть книгу">📖 Открыть</button>
    <input type="file" id="file-input" accept=".epub,.txt" multiple hidden>

    <div id="settings" class="hidden">
      <div class="set-tabs">
        <button class="set-tab active" data-tab="reading">Чтение</button>
        <button class="set-tab" data-tab="theme">Оформление</button>
      </div>

      <div class="set-pane" data-pane="reading">
        <div class="set-row">Размер шрифта
          <span class="set-group">
            <button id="btn-font-minus" aria-label="Уменьшить шрифт">A−</button>
            <span id="set-font-val"></span>
            <button id="btn-font-plus" aria-label="Увеличить шрифт">A＋</button>
          </span>
        </div>
        <label>Шрифт <select id="set-font"></select></label>
        <div class="set-row">Направление текста
          <button id="btn-mode" aria-label="Направление текста">縦書き</button>
        </div>
        <div class="set-row">Режим отображения
          <button id="btn-view" aria-label="Режим отображения">スクロール</button>
        </div>
        <label>Межстрочный интервал
          <input type="range" id="set-line-height" min="1.0" max="3" step="0.1">
          <span id="set-line-height-val"></span>
        </label>
        <label>Абзацный отступ
          <input type="range" id="set-indent" min="0" max="4" step="0.1">
          <span id="set-indent-val"></span>
        </label>
        <label>Ширина текста
          <input type="range" id="set-width" min="400" max="2400" step="20">
          <span id="set-width-val"></span>
        </label>
        <label>Сохранять позицию с задержкой
          <input type="checkbox" id="set-delayed-save">
        </label>
        <label>Размывать картинки до клика
          <input type="checkbox" id="set-blur-images">
        </label>
        <label>Скрывать верхнюю панель
          <input type="checkbox" id="set-hide-top">
        </label>
        <label>Скрывать нижнюю панель
          <input type="checkbox" id="set-hide-bottom">
        </label>
      </div>

      <div class="set-pane hidden" data-pane="theme">
        <label>Тема <select id="set-theme"></select></label>
        <div id="theme-preview"><span>本 日本語のテキスト</span></div>
        <div id="custom-colors" class="hidden">
          <label>Текст книги <input type="color" id="col-reader-fg"></label>
          <label>Фон книги <input type="color" id="col-reader-bg"></label>
          <label>Текст интерфейса <input type="color" id="col-fg"></label>
          <label>Фон интерфейса <input type="color" id="col-bg"></label>
          <label>Панели <input type="color" id="col-panel"></label>
          <label>Границы <input type="color" id="col-border"></label>
          <label>Акцент <input type="color" id="col-accent"></label>
          <label>Второстепенный текст <input type="color" id="col-muted"></label>
        </div>
      </div>

      <button id="set-reset">Сбросить</button>
    </div>
  </header>

  <div id="layout">
    <nav id="toc" class="hidden">
      <details id="bm-section" open>
        <summary>しおり</summary>
        <ul id="bm-list"></ul>
      </details>
      <details id="toc-section">
        <summary>目次</summary>
        <ul id="toc-list"></ul>
      </details>
    </nav>

    <main id="reader">
      <div id="welcome">
        <h1>日本本</h1>
        <p>Читалка книг на японском языке.</p>
        <p>Откройте файл <strong>.epub</strong> или <strong>.txt</strong>,<br>
           либо перетащите его сюда.</p>
        <button id="btn-open-welcome">📖 Открыть книгу</button>
      </div>
      <div id="content" class="hidden">
        <div id="flow" class="flow"></div>
      </div>
    </main>
  </div>

  <div id="library-modal" class="hidden">
    <div class="lib-backdrop"></div>
    <div class="lib-dialog" role="dialog" aria-label="Недавние книги">
      <header class="lib-head">
        <h2>本棚 — недавние книги</h2>
        <button id="lib-open">📖 Открыть файл</button>
        <button id="lib-close" aria-label="Закрыть">✕</button>
      </header>
      <div id="lib-grid"></div>
    </div>
  </div>

  <div id="edge-bottom" class="edge-zone"></div>

  <footer id="navbar" class="hidden">
    <button id="btn-prev">← 前へ</button>
    <span id="chapter-info"></span>
    <button id="btn-next">次へ →</button>
  </footer>

  <script src="lib/kuromoji.js"></script>
  <script src="js/zip.js"></script>
  <script src="js/reader.js"></script>
  <script src="js/epub.js"></script>
  <script src="js/txt.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/furigana.js"></script>
  <script src="js/select.js"></script>
  <script src="js/library.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
