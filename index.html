<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本本 — читалка японских книг</title>
  <!-- Путь относительный: сайт живёт в подкаталоге /nihonhon/ на Pages -->
  <link rel="icon" href="favicon.ico" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="toolbar">
    <button id="btn-toc" data-tip="Оглавление и закладки" aria-label="Оглавление и закладки">☰</button>
    <span id="book-title">日本本</span>
    <div class="spacer"></div>
    <button id="btn-view" data-tip="Режим отображения" aria-label="Режим отображения">スクロール</button>
    <button id="btn-mode" data-tip="Направление текста" aria-label="Направление текста">縦書き</button>
    <button id="btn-font-minus" data-tip="Уменьшить шрифт" aria-label="Уменьшить шрифт">A−</button>
    <button id="btn-font-plus" data-tip="Увеличить шрифт" aria-label="Увеличить шрифт">A＋</button>
    <button id="btn-bookmark" data-tip="Добавить закладку" aria-label="Добавить закладку">🔖</button>
    <button id="btn-recent" data-tip="Недавние книги" aria-label="Недавние книги">📚</button>
    <button id="btn-settings" data-tip="Настройки" aria-label="Настройки">⚙</button>
    <button id="btn-open" data-tip="Открыть книгу (.epub / .txt)" aria-label="Открыть книгу">📖 Открыть</button>
    <input type="file" id="file-input" accept=".epub,.txt" multiple hidden>

    <div id="settings" class="hidden">
      <label>Цвет текста <input type="color" id="set-fg"></label>
      <label>Цвет фона <input type="color" id="set-bg"></label>
      <label>Ширина текста
        <input type="range" id="set-width" min="400" max="2400" step="20">
        <span id="set-width-val"></span>
      </label>
      <label>Сохранять позицию с задержкой
        <input type="checkbox" id="set-delayed-save">
      </label>
      <button id="set-reset">Сбросить</button>
    </div>
  </header>

  <div id="layout">
    <nav id="toc" class="hidden">
      <details id="bm-section" open>
        <summary>しおり</summary>
        <ul id="bm-list"></ul>
      </details>
      <details id="toc-section">
        <summary>目次</summary>
        <ul id="toc-list"></ul>
      </details>
    </nav>

    <main id="reader">
      <div id="welcome">
        <h1>日本本</h1>
        <p>Читалка книг на японском языке.</p>
        <p>Откройте файл <strong>.epub</strong> или <strong>.txt</strong>,<br>
           либо перетащите его сюда.</p>
        <button id="btn-open-welcome">📖 Открыть книгу</button>
      </div>
      <div id="content" class="hidden">
        <div id="flow" class="flow"></div>
      </div>
    </main>
  </div>

  <div id="library-modal" class="hidden">
    <div class="lib-backdrop"></div>
    <div class="lib-dialog" role="dialog" aria-label="Недавние книги">
      <header class="lib-head">
        <h2>本棚 — недавние книги</h2>
        <button id="lib-open">📖 Открыть файл</button>
        <button id="lib-close" aria-label="Закрыть">✕</button>
      </header>
      <div id="lib-grid"></div>
    </div>
  </div>

  <footer id="navbar" class="hidden">
    <button id="btn-prev">← 前へ</button>
    <span id="chapter-info"></span>
    <button id="btn-next">次へ →</button>
  </footer>

  <script src="lib/kuromoji.js"></script>
  <script src="js/zip.js"></script>
  <script src="js/reader.js"></script>
  <script src="js/epub.js"></script>
  <script src="js/txt.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/furigana.js"></script>
  <script src="js/select.js"></script>
  <script src="js/library.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
